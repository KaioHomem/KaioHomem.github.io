<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="Preview das Ferramentas BR — quatro calculadoras financeiras">
  <defs>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="verde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="460" fill="#0d1117"/>
  <rect width="800" height="460" fill="url(#brilho)"/>

  <!-- top bar -->
  <rect x="0" y="0" width="800" height="46" fill="#0d1117"/>
  <line x1="0" y1="46" x2="800" y2="46" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="30" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">ferramentas<tspan fill="#58a6ff">.</tspan></text>
  <g font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#8b949e">
    <text x="512" y="30">Salário</text>
    <text x="576" y="30">Rescisão</text>
    <text x="652" y="30">Juros</text>
    <text x="706" y="30">Financiamento</text>
  </g>

  <!-- headline -->
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="40" y="76" width="196" height="21" rx="10.5" fill="none" stroke="#30363d"/>
    <circle cx="55" cy="86.5" r="3" fill="#3fb950"/>
    <text x="65" y="91" font-family="JetBrains Mono, monospace" font-size="10" fill="#6e7681">tabelas de 2026 atualizadas</text>

    <text x="40" y="132" font-size="27" font-weight="700" fill="#e6edf3">Calculadoras que respondem</text>
    <text x="40" y="164" font-size="27" font-weight="700" fill="#e6edf3">em um clique</text>
    <text x="40" y="192" font-size="13" fill="#8b949e">Sem cadastro. Tudo roda no seu navegador.</text>
  </g>

  <!-- tool tiles -->
  <g font-family="Inter, system-ui, sans-serif">
    <!-- 1 -->
    <rect x="40" y="220" width="176" height="106" rx="12" fill="#161b22" stroke="#58a6ff"/>
    <text x="58" y="252" font-size="19">💰</text>
    <text x="58" y="278" font-size="13.5" font-weight="600" fill="#e6edf3">Salário líquido</text>
    <text x="58" y="297" font-size="10.5" fill="#8b949e">INSS + IRRF com a isenção</text>
    <text x="58" y="312" font-size="10.5" fill="#58a6ff">Calcular →</text>

    <!-- 2 -->
    <rect x="232" y="220" width="176" height="106" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="250" y="252" font-size="19">📄</text>
    <text x="250" y="278" font-size="13.5" font-weight="600" fill="#e6edf3">Rescisão</text>
    <text x="250" y="297" font-size="10.5" fill="#8b949e">Verba por verba, com FGTS</text>
    <text x="250" y="312" font-size="10.5" fill="#58a6ff">Calcular →</text>

    <!-- 3 -->
    <rect x="424" y="220" width="176" height="106" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="442" y="252" font-size="19">📈</text>
    <text x="442" y="278" font-size="13.5" font-weight="600" fill="#e6edf3">Juros compostos</text>
    <text x="442" y="297" font-size="10.5" fill="#8b949e">Aportes mensais e gráfico</text>
    <text x="442" y="312" font-size="10.5" fill="#58a6ff">Simular →</text>

    <!-- 4 -->
    <rect x="616" y="220" width="144" height="106" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="634" y="252" font-size="19">🏠</text>
    <text x="634" y="278" font-size="13.5" font-weight="600" fill="#e6edf3">Financiamento</text>
    <text x="634" y="297" font-size="10.5" fill="#8b949e">Price × SAC</text>
    <text x="634" y="312" font-size="10.5" fill="#58a6ff">Simular →</text>
  </g>

  <!-- result strip -->
  <rect x="40" y="352" width="720" height="72" rx="12" fill="#161b22" stroke="rgba(63,185,80,0.35)"/>
  <rect x="40" y="352" width="720" height="72" rx="12" fill="url(#verde)"/>
  <text x="62" y="379" font-family="JetBrains Mono, monospace" font-size="9.5" letter-spacing="1.1" fill="#8b949e">SALÁRIO LÍQUIDO</text>
  <text x="62" y="409" font-family="JetBrains Mono, monospace" font-size="25" font-weight="700" fill="#3fb950">R$ 4.498,49</text>
  <text x="560" y="384" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">INSS  − R$ 501,51</text>
  <text x="560" y="406" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">IRRF  isento</text>
</svg>
